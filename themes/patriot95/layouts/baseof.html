<!DOCTYPE html>
<html lang='{{ .Site.LanguageCode | default "ru" }}'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="font-body text-ink leading-relaxed">

    <header class="container mx-auto p-4 border-double">
        {{ partial "header.html" . }}
    </header>

    <button id="sidebar-open" class="lg:hidden fixed bottom-6 right-6 z-50 bg-[#a0522d] text-white p-4 rounded-full shadow-xl focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden transition-opacity duration-300 opacity-0"></div>

    <main class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2">
            {{ block "main" . }}{{ end }}
        </div>

        <aside id="sidebar" class="fixed inset-y-0 right-0 z-40 w-[90%] bg-[#f4f1ea] border-l shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 lg:w-full lg:shadow-none lg:border-none lg:bg-transparent lg:col-span-1 pt-2 pl-2 overflow-y-auto">
            <div class="lg:hidden p-4 flex justify-end">
                <button id="sidebar-close" class="text-ink focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            {{ partial "sidebar.html" . }}
        </aside>
    </main>

    <footer class="container mx-auto px-4 py-6 mt-8 text-center text-sm">
        {{ partial "footer.html" . }}
    </footer>

    <script src="/js/localTailwind.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
